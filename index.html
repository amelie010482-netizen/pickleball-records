:root[data-theme=dark]{--bg:#22242A;--card:#2C2F36;--ink:#E7E4DE;--muted:#9A9A92;--line:#3A3D45}
:root[data-theme=light]{--bg:#F7F5F1;--card:#FFF;--ink:#3A3A38;--muted:#8A8A84;--line:#E7E3DB}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC",Segoe UI,sans-serif;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:1.3rem;margin:0 0 2px}.sub{color:var(--muted);font-size:.8rem;margin-bottom:14px}
.vtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.vtab{padding:8px 13px;border-radius:10px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-size:.85rem;color:var(--muted)}
.vtab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.vtab small{display:block;font-size:.66rem;opacity:.8}
.venue{display:none}.venue.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.kpi .v{font-size:1.4rem;font-weight:700;color:var(--blue-d)}.kpi .l{font-size:.72rem;color:var(--muted)}.kpi .n{font-size:.64rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:.95rem}
.hm{overflow-x:auto}.hm table{border-collapse:collapse;min-width:720px}.hm td,.hm th{text-align:center;padding:2px;font-size:.66rem;border:none;color:var(--muted)}
.cell{width:25px;height:20px;border-radius:4px;display:inline-block;line-height:20px;color:#fff;font-size:.6rem}
table.rec{width:100%;border-collapse:collapse;font-size:.82rem}
table.rec th,table.rec td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
table.rec th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card)}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--blue)}
.expand{cursor:pointer;color:var(--blue-d);font-size:.75rem}
.slots{font-size:.72rem;color:var(--muted);margin-top:4px;display:none;line-height:1.9}
.slots.on{display:block}
.bands{display:flex;gap:5px}
.bd{flex:1;text-align:center;border-radius:7px;padding:4px 2px;background:var(--line)}
.bd b{display:block;font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums}
.bd small{font-size:.6rem;color:var(--muted)}
.bd.lo{background:#EAF0EF}.bd.mid{background:#E7D9BE}.bd.bad{background:#D8B6A6}
.bd.lo b{color:#6a7a72}.bd.mid b{color:#8a6d2e}.bd.bad b{color:#9a4f3a}
@media(prefers-color-scheme:dark){.bd.lo{background:#33403c}.bd.mid{background:#4a4023}.bd.bad{background:#4d3229}.bd.lo b{color:#a9c2b8}.bd.mid b{color:#d6b970}.bd.bad b{color:#e0a088}}
.legend2{font-size:.72rem;color:var(--muted);margin:8px 0 4px}
.chip{display:inline-block;background:#EADFE0;color:#8f5f61;border-radius:16px;padding:1px 7px;margin:1px;font-size:.66rem}
@media(prefers-color-scheme:dark){.chip{background:#4a3a3c;color:#d9b5b7}}
.note{font-size:.75rem;color:var(--muted);padding:9px;background:var(--bg);border-radius:8px;border:1px solid var(--line);margin-top:6px}
.tag{font-size:.64rem;padding:1px 6px;border-radius:12px;background:#F3E6D6;color:#96703f}
@media(prefers-color-scheme:dark){.tag{background:#4a4230;color:#d6c08a}}
</style></head><body><div class="wrap">

const pct=x=>x==null?'—':(x*100).toFixed(0)+'%';

 const kpis=K.map(k=>`<div class="kpi"><div class="v">${k[1]}</div><div class="l">${k[0]}</div><div class="n">${k[2]}</div></div>`).join('');
 let heat='';
 if(!v.day_level){let h='<table><thead><tr><th></th>';for(let x=0;x<24;x++)h+=`<th>${x}</th>`;h+='</tr></thead><tbody>';
  for(let w=0;w<7;w++){h+=`<tr><th>${D.weekdays[w]}</th>`;for(let x=0;x<24;x++){const r=v.heatmap[w][x];h+=`<td><span class="cell" style="background:${heatColor(r)}" title="${D.weekdays[w]} ${x}:00 ${r==null?'無資料':pct(r)}">${r==null?'':Math.round(r*100)}</span></td>`}h+='</tr>'}
